---
name: homarr

services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.6.0
    container_name: homarr-socket-proxy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    environment:
      CONTAINERS: 1
      IMAGES: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  homarr:
    image: ghcr.io/homarr-labs/homarr:v2.14.0
    container_name: homarr
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    mem_limit: 512m
    ports:
      # 7575 is homarr's built-in proxy (UI + websockets), 3000 only the app
      - "127.0.0.1:${HOMARR_PORT:-7575}:7575"
    environment:
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY}
      # Read-only Docker access through the socket proxy (POST=0 disables
      # the start/stop buttons on app tiles)
      DOCKER_HOSTNAMES: docker-socket-proxy
      DOCKER_PORTS: "2375"
      # Resolve the socket proxy freshly, its IP changes when it is recreated
      ENABLE_DNS_CACHING: "false"
      DISABLE_ANALYTICS: "true"
      NEXT_TELEMETRY_DISABLED: 1
      TZ: Europe/Berlin
    volumes:
      - ./data:/appdata
    depends_on:
      - docker-socket-proxy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
