---
name: navidrome

services:
  navidrome:
    image: deluan/navidrome:0.64.2
    container_name: navidrome
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    # Runs directly as PUID/PGID (no entrypoint user switch needed)
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "127.0.0.1:${NAVIDROME_PORT:-4533}:4533"
    environment:
      TZ: Europe/Berlin
      ND_LOGLEVEL: info
      # Full rescan once a day; new files are also picked up by the file watcher
      ND_SCANSCHEDULE: "@every 24h"
      # Do not send anonymous usage statistics
      ND_ENABLEINSIGHTSCOLLECTOR: "false"
    volumes:
      # Database, cache and settings
      - ./data:/data
      # Music library, read-only
      - ${NAVIDROME_MUSIC_PATH:-./music}:/music:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4533/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
