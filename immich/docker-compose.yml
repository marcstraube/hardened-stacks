---
name: immich

services:
  postgres:
    image: ghcr.io/immich-app/postgres:18-vectorchord1.1.1-pgvector0.8.7
    container_name: immich-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    # Immich requires at least 2 GB for Postgres when limits are used
    mem_limit: 2g
    shm_size: 128mb
    labels:
      # Report new VectorChord/pgvector builds for Postgres 18 only; the tags
      # are not semver, so all of them are watched
      diun.include_tags: '^18-vectorchord\d+\.\d+\.\d+-pgvector\d+\.\d+\.\d+$$'
      diun.max_tags: "100"
    environment:
      POSTGRES_DB: immich
      POSTGRES_USER: immich
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      # Tunes Postgres for the disk type (SSD or HDD)
      DB_STORAGE_TYPE: HDD
    volumes:
      # Postgres 18+ keeps its data in a versioned subdirectory (18/docker)
      - ./postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immich"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.4.12-alpine
    container_name: immich-redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.4.2
    container_name: immich-server
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    mem_limit: 2g
    ports:
      - "127.0.0.1:${IMMICH_PORT:-2283}:2283"
    environment:
      DB_HOSTNAME: postgres
      DB_DATABASE_NAME: immich
      DB_USERNAME: immich
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOSTNAME: redis
      TZ: Europe/Berlin
    volumes:
      - ${IMMICH_UPLOAD_PATH:-./upload}:/data
      - ${IMMICH_EXTERNAL_PATH:-./external}:/usr/src/app/external:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.4.2
    container_name: immich-machine-learning
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    mem_limit: 4g
    volumes:
      - ./model-cache:/cache
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
