---
name: Update Docker Images

on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-images:
    name: Update images
    runs-on: ubuntu-latest

    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check and apply updates
        id: updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY=""

          while IFS= read -r entry; do
            name=$(echo "$entry" | jq -r '.name')
            image=$(echo "$entry" | jq -r '.image')
            github_repo=$(echo "$entry" | jq -r '.github_repo')
            file=$(echo "$entry" | jq -r '.file')
            jq_filter=$(echo "$entry" | jq -r '.jq_filter')
            api=$(echo "$entry" | jq -r '.api // empty')
            extra_images=$(echo "$entry" | jq -r '.extra_images // empty')
            extra_files=$(echo "$entry" | jq -r '.extra_files // empty')

            # Get current version from compose file
            CURRENT=$(grep -m1 "image: ${image}:" "$file" \
              | sed "s|.*${image}:||" | tr -d ' "')

            # Get latest version from API
            if [ "$api" = "codeberg" ]; then
              LATEST=$(curl -sf \
                "https://codeberg.org/api/v1/repos/${github_repo}/releases/latest" \
                | jq -r "$jq_filter")
            elif [ "$api" = "releases-list" ]; then
              LATEST=$(gh api "repos/${github_repo}/releases" \
                --jq "$jq_filter")
            else
              LATEST=$(gh api "repos/${github_repo}/releases/latest" \
                --jq "$jq_filter")
            fi

            echo "${name}: ${CURRENT} → ${LATEST}"

            if [ "$CURRENT" != "$LATEST" ] && [ -n "$LATEST" ] && [ "$LATEST" != "null" ]; then
              sed -i "s|image: ${image}:${CURRENT}|image: ${image}:${LATEST}|g" "$file"

              if [ -n "$extra_images" ]; then
                for extra in $extra_images; do
                  sed -i "s|image: ${extra}:${CURRENT}|image: ${extra}:${LATEST}|g" "$file"
                done
              fi

              if [ -n "$extra_files" ]; then
                for ef in $extra_files; do
                  sed -i "s|image: ${image}:${CURRENT}|image: ${image}:${LATEST}|g" "$ef"
                done
              fi

              BODY="${BODY}- **${name}:** \`${CURRENT}\` → \`${LATEST}\`"$'\n'
            fi
          done < <(jq -c '.[]' .github/images.json)

          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.updates.outputs.body != ''
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: 'chore(deps): update docker images'
          branch: chore/update-docker-images
          title: 'chore(deps): update docker images'
          body: |
            Automated update of Docker images.

            ${{ steps.updates.outputs.body }}

            ---
            *Created by the `update-images` workflow.*
          labels: dependencies
          delete-branch: true
