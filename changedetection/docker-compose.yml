---
name: changedetection

services:
  changedetection:
    image: ghcr.io/dgtlmoon/changedetection.io:0.70.4
    container_name: changedetection
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    # Runs directly as PUID/PGID (the entrypoint does no user switch)
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "127.0.0.1:${CHANGEDETECTION_PORT:-5050}:5000"
    environment:
      TZ: Europe/Berlin
      # Public URL, used for links in notifications
      BASE_URL: ${CHANGEDETECTION_BASE_URL:-http://localhost:5050}
      # Trust X-Forwarded-* headers from the reverse proxy
      USE_X_SETTINGS: 1
      # Monitored sites do not see where the request comes from
      HIDE_REFERER: "true"
      # No version check / telemetry request
      DISABLE_VERSION_CHECK: "true"
      # Parallel fetchers (default 10); a few are enough on a NAS
      FETCH_WORKERS: 3
      LOGGER_LEVEL: INFO
    volumes:
      # Watches, history, snapshots and settings
      - ./data:/datastore
    healthcheck:
      # No wget/curl in the image
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:5000/', timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
